# ABRACADABRA digital menu: static files behind Traefik (TLS is terminated there)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index cinematic-board.html;
    absolute_redirect off;   # TLS ends at Traefik: send relative redirects so the browser keeps https

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # short addresses that are easy to type on a TV remote
    location = /      { return 302 /cinematic-board.html?screen=1; }
    location = /1     { return 302 /cinematic-board.html?screen=1; }
    location = /2     { return 302 /cinematic-board.html?screen=2; }
    location = /admin { return 302 /admin.html; }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # the menu itself: always revalidate, so an edited menu-data.js reaches the TVs within minutes
    location ~* \.(html|js)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    # fonts, images and the Higgsfield clips never change under the same name; mp4 supports range requests
    location ~* \.(mp4|png|jpg|woff2|css)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }
}
