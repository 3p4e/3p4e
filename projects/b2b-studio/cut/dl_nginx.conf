# Private downloads: files only under /_dl_<long random token>/, no listings, nothing indexable.
server {
  listen 80; root /usr/share/nginx/html; autoindex off; server_tokens off;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nDisallow: /\n"; }
  location ~ "^/_dl_[0-9a-f]{20,}/[^/]+$" { try_files $uri =404; }
  location / { return 404; }
}
