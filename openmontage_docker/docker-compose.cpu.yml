version: '3.8'

services:
  openmontage:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: openmontage
    environment:
      - PYTHONPATH=/home/openmontage/OpenMontage
    volumes:
      - ./openmontage_data:/home/openmontage/OpenMontage/data
      - ./openmontage_output:/home/openmontage/OpenMontage/output
      - ./openmontage_env:/home/openmontage/OpenMontage/.env
    stdin_open: true
    tty: true
    restart: unless-stopped
