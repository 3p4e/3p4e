# BIG DOGMA public studio site (public and indexable since 2026-11-25; the private pitch and download hosts stay noindex).
# Media is cached for 30 days: gen_site.py puts a ?v=<content hash> on every media URL, so rebuilt files get new URLs.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  autoindex off;
  server_tokens off;
  charset utf-8;
  charset_types text/css application/javascript text/vtt text/plain;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json text/plain text/vtt image/svg+xml font/ttf application/x-font-ttf;

  # server-level headers: no location below uses add_header, so these are inherited everywhere
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  # the private pitch pages (pitch.bigdogma.tech) stream the BD logo films and header effects from here; the header keys the
  # video frames on a canvas, which needs CORS (2026-11-26)
  add_header Access-Control-Allow-Origin "https://pitch.bigdogma.tech" always;

  error_page 404 /404.html;

  location = / { try_files /index.html =404; expires -1; }
  location = /index.html { expires -1; }
  location = /robots.txt { expires 1h; }
  location = /sitemap.xml { default_type application/xml; expires 1h; }
  location ~* \.vtt$ { default_type text/vtt; expires 7d; }
  location ~* \.ttf$ { default_type font/ttf; expires 30d; }
  location ~* \.woff2$ { expires 30d; }
  location ~* \.(css|js)$ { expires 7d; }
  location ~* \.(mp4|webm|jpg|jpeg|png|webp)$ { expires 30d; access_log off; }
  location / { try_files $uri $uri/ =404; }
}
