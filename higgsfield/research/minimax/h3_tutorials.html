ify for our program. Keep an eye on your notifications for a potential invitation!\",\"affiliate_faq_answer_10\":\"We freeze a portion of your earnings as a precautionary measure when a significant number of your referred users request refunds. The freeze structure works as follows:\\n\\n- Refund rate 20% to \u003c30%: We freeze your withdrawable earnings + 20% of pending earnings\\n- Refund rate 30% to \u003c50%: We freeze your withdrawable earnings + 50% of pending earnings\\n- Refund rate ≥50%: We freeze all withdrawable and pending earnings\\n\\nAfter a freeze is triggered, you enter a 30-day observation period. If your daily average refund rate remains below 10% during this period, we'll unfreeze 25% of your earnings every 7 days. If the refund rate exceeds 10%, the observation period timer resets.\",\"affiliate_faq_answer_11\":\"Your withdrawable earnings may show a negative balance when refunds or chargebacks occur among your referred users. When this happens, we deduct the corresponding amounts from your commission. If your available withdrawable balance is insufficient to cover these deductions, your earnings will display as negative until future commissions offset the deficit.\",\"affiliate_faq_answer_12\":\"Our affiliate program currently focuses on product sales only. We don't offer a multi-tier system, so you cannot earn commissions from sales made by other affiliates you might refer. However, stay tuned for potential program updates in the future!\",\"affiliate_faq_answer_13\":\"We prohibit spam, misleading advertisements, and any methods that violate our terms and conditions. Any promotional activities that could potentially damage HailuoAI's reputation are also strictly forbidden. We expect our affiliates to maintain ethical marketing practices at all times.\",\"affiliate_faq_answer_14\":\"No, creating websites or social media profiles that could be confused with HailuoAI's official properties is strictly prohibited. Your promotional materials should clearly indicate that you are an affiliate partner, not an official representative of HailuoAI.\",\"affiliate_faq_answer_15\":\"Violations of our promotional guidelines may result in the suspension or termination of your affiliate account. Additionally, we reserve the right to withhold any commissions earned through prohibited promotional methods. We take the integrity of our affiliate program seriously to maintain trust with our customers.\",\"affiliate_faq_answer_2\":\"Individuals, bloggers, social media influencers, website owners, and businesses are welcome to apply if they meet these requirements:\\n  - Comply with our platform's terms of service and promotion policies\\n  - Do not promote illegal, infringing, or adult content\\n  - Adhere to the laws and regulations of your country and the regions where you promote\",\"affiliate_faq_answer_3\":\"Your earning potential is unlimited! You'll receive 10% commission on the first-month subscription fees from any paying users you refer to our Standard, Pro, or Unlimited plans. The more you promote, the more you earn.\\n\\nExample: If you refer 10 Pro monthly subscribers and 20 Unlimited yearly subscribers, you'll earn:\\n(10×$34.99 + 20×$1139.88) × 95% × 10% = $2,199\\n\\n- $34.99 is the Pro Monthly Plan price, $1139.88 is the Unlimited Yearly Plan price\\n- 95% represents the actual amount paid by referred users after their 5% discount\\n- 10% is your commission rate\",\"affiliate_faq_answer_4\":\"Our commission structure is designed to benefit both affiliates and new customers:\\n- You receive a 10% commission on each subscription generated through your referral link\\n- New users who sign up through your link enjoy a 5% discount on their first order\\n- The commission is calculated based on the discounted amount paid by the referred customer\",\"affiliate_faq_answer_5\":\"You can track your earnings on the affiliate dashboard. Commissions become available for withdrawal 30 days after your referred customer makes a payment. For example, if someone purchases a subscription on March 1st, that commission will be recorded as pending and become withdrawable on April 1st.\\n\\nFor annual subscriptions, we distribute commissions in installments. You'll receive 1/12 of the total commission each month for the first 6 months, then the remaining 6/12 as a lump sum in the 7th month. For instance, if you earn a $120 commission from an annual subscription, you'll receive $10 monthly for the first six months, followed by $60 in the seventh month.\",\"affiliate_faq_answer_6\":\"You can invite users who:\\n- Have not yet subscribed to any of our paid plans\\n- Have not already been referred by another affiliate\",\"affiliate_faq_answer_7\":\"The cookie from your referral link remains active for 7 days. This means if someone clicks your link and makes a purchase within that 7-day window, you'll earn the commission for the sale.\",\"affiliate_faq_answer_8\":\"No, affiliate members cannot earn commission on their own purchases. The affiliate program is designed to reward you for bringing in new customers.\",\"affiliate_faq_answer_9\":\"If a customer you referred requests a refund, the associated commission will not be paid or will be deducted from your future earnings. If your referrals show a pattern of high refund rates, we may temporarily freeze a portion of your earnings until the refund rate normalizes. In cases of suspected fraudulent activity, we reserve the right to withhold payouts or clear earnings entirely.\",\"affiliate_faq_question_1\":\"How do I join the affiliate program?\",\"affiliate_faq_question_10\":\"What are frozen earnings and how can they be unfrozen?\",\"affiliate_faq_question_11\":\"Why is my withdrawable earnings balance negative?\",\"affiliate_faq_question_12\":\"Can I earn commission from other affiliates I refer to the program?\",\"affiliate_faq_question_13\":\"What promotional methods are prohibited in the affiliate program?\",\"affiliate_faq_question_14\":\"Can I
