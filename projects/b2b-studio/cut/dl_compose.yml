name: bigdogma-dl
services:
  web:
    image: nginx:alpine
    container_name: bigdogma-dl
    restart: unless-stopped
    volumes:
      - /opt/stacks/bigdogma-dl/site:/usr/share/nginx/html:ro
      - /opt/stacks/bigdogma-dl/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 128m
    pids_limit: 64
    labels:
      - traefik.enable=true
      - traefik.http.routers.bigdogma-dl.rule=Host(`dl.bigdogma.tech`)
      - traefik.http.routers.bigdogma-dl.entrypoints=websecure
      - traefik.http.routers.bigdogma-dl.tls.certresolver=letsencrypt
      - traefik.http.services.bigdogma-dl.loadbalancer.server.port=80
