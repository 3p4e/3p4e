# pitch.bigdogma.tech (Mumbai). H3 films are geo-gated: the MiniMax H3 licence bars displaying them in the EU, the UK, the USA and
# South Korea, so visitors from those territories get 404 for /<token>/h3/*. The list is built monthly by /opt/h3/tools/build_geo.py
# (DB-IP Lite, CC BY 4.0).
set_real_ip_from 172.16.0.0/12; set_real_ip_from 10.0.0.0/8; set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For; real_ip_recursive on;
geo $h3_blocked { default 0; include /etc/nginx/h3_block.conf; }
server {
  listen 80; root /usr/share/nginx/html; autoindex off; server_tokens off;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  location = / { return 404; }
  location = /robots.txt { }
  location ~ "^/(?<tok>[A-Za-z0-9_-]{8,})/h3/(?<f>[A-Za-z0-9_.-]*)$" {
    if ($h3_blocked) { return 404; }
    alias /h3web/$tok/$f; autoindex on; autoindex_format json;
    add_header Cache-Control "private, max-age=3600" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location ~ "^/[A-Za-z0-9_-]{8,}/" { try_files $uri $uri/index.html =404; expires 1h; }
  location / { return 404; }
}
